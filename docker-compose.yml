services:
  # HAAI Web UI Frontend Service
  haai-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haai-web
    restart: unless-stopped
    ports:
      - "8111:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional Companion Service: Local LLM Engine (Ollama)
  # Uncomment the block below if you want Ollama running alongside HAAI in the same Docker stack
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: haai-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_ORIGINS=*

